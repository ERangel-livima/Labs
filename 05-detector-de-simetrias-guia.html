<template id="paginas">
  <article class="pagina"><div class="portada">
    <span class="grado">6° - Parada 5 de la expedición</span>
    <div><h1>Detector de Simetrías</h1><div class="lema">Guía de la expedición: el mundo en el espejo</div></div>
    <img src="3d/mati.webp" alt="Mati, el que observa, con su lupa">
    <div class="pie">LIVIMA - Laboratorios Vivos de Matemática y Arte<br>Institución Educativa Juan XXIII, Montería</div>
  </div></article>

  <article class="pagina">
    <h2>Ficha del explorador</h2>
    <p class="sub">Una expedición para cazar simetrías, individual y en equipo.</p>
    <div class="campo"><label>Nombre: <input type="text"></label><label>Grado y grupo: <input type="text"></label></div>
    <div class="campo"><label>Compañeros de expedición: <input type="text"></label><label>Fecha: <input type="text"></label></div>
    <p>Hoy te vuelves explorador. En LIVIMA el colegio y el barrio son tu laboratorio: vas a buscar una idea matemática que se esconde en las hojas, las rejas, las flores y los rostros, y que casi nadie nota. Algo es simétrico cuando una parte es el reflejo exacto de la otra, o cuando se ve igual al girarlo; las dos cosas pueden pasar en la misma figura.</p>
    <div class="caja mati"><b>Pregunta orientadora:</b> ¿dónde se esconde la simetría en mi entorno y de cuántas clases es?</div>
  </article>

  <article class="pagina">
    <h2><span class="num">1</span>Observo, la expedición</h2>
    <p>En equipo, recorre los lugares que indique tu docente (el colegio y, si se puede, una cuadra del barrio). Busca cosas que parezcan tener dos mitades iguales o que se repitan al girar: ventanas, rejas, baldosas, hojas, flores, insectos, logos.</p>
    <ul class="pasos">
      <li>Dibuja o calca cada hallazgo en tu bitácora: tu lápiz es tu instrumento.</li>
      <li>Recoge muestras naturales que se puedan llevar (una hoja, una flor caída).</li>
    </ul>
    <p class="etiqueta">Mi bitácora: al menos cuatro hallazgos</p>
    <table>
      <tr><th>¿Qué encontré y dónde?</th><th>¿Parece simétrico?</th></tr>
      <tr><td><input type="text" aria-label="Hallazgo 1"></td><td><input type="text" aria-label="Parece simétrico, hallazgo 1"></td></tr>
      <tr><td><input type="text" aria-label="Hallazgo 2"></td><td><input type="text" aria-label="Parece simétrico, hallazgo 2"></td></tr>
      <tr><td><input type="text" aria-label="Hallazgo 3"></td><td><input type="text" aria-label="Parece simétrico, hallazgo 3"></td></tr>
      <tr><td><input type="text" aria-label="Hallazgo 4"></td><td><input type="text" aria-label="Parece simétrico, hallazgo 4"></td></tr>
    </table>
  </article>

  <article class="pagina">
    <h2><span class="num">2</span>Investigo, pongo a prueba cada hallazgo</h2>
    <p>De vuelta en el aula, comprueba si tus hallazgos son de verdad simétricos. Tienes dos herramientas:</p>
    <ol class="pasos">
      <li><b>El espejito:</b> apóyalo de pie sobre el dibujo. Si en el espejo ves completarse la misma figura, hay simetría, y el borde del espejo marca el eje.</li>
      <li><b>El doblez:</b> dobla la muestra o el dibujo. Si las dos mitades coinciden exactamente, el pliegue es un eje de simetría.</li>
    </ol>
    <p>Luego separa tus capturas en cuatro montones: las que solo tienen espejo, las que solo calzan al girar (la más rara), las que tienen las dos cosas y las que no tienen ninguna.</p>
    <div class="campo"><label>¿Qué te sorprendió al comprobar con el espejo o el doblez? <input type="text"></label></div>
  </article>

  <article class="pagina">
    <h2><span class="num">3</span>Descubro la matemática</h2>
    <p>Esos cuatro montones tienen nombres matemáticos:</p>
    <table>
      <tr><td><b>Eje de simetría</b></td><td>La línea que divide una figura en dos mitades que coinciden exactamente, como un espejo.</td></tr>
      <tr><td><b>Simetría bilateral</b></td><td>La figura se refleja sobre uno o varios ejes (una mariposa, un rostro, una hoja).</td></tr>
      <tr><td><b>Simetría radial</b></td><td>La figura se repite al girar alrededor de un centro. Un remolino es el caso puro: gira igual cada 90°, pero ningún espejo lo deja igual.</td></tr>
      <tr><td><b>Espejo y giro</b></td><td>Muchas figuras de la naturaleza tienen las dos a la vez: una flor de 5 pétalos, un copo de nieve, un cuadrado.</td></tr>
    </table>
    <div class="caja mati"><b>Pon a prueba tu ojo de detective:</b> en la mesa del kiosco haz las dos pruebas con los 8 hallazgos. Uno solo tiene giro: es la trampa del detective.</div>
  </article>

  <article class="pagina">
    <h2>Clasifico mis hallazgos</h2>
    <table>
      <tr><th>Mi hallazgo</th><th>¿Tiene eje?</th><th>¿Calza al girar?</th><th>Bilateral, radial, ambas o ninguna</th></tr>
      <tr><td><input type="text" aria-label="Hallazgo 1"></td><td><input type="text" aria-label="Tiene eje 1"></td><td><input type="text" aria-label="Calza al girar 1"></td><td><input type="text" aria-label="Clase de simetría 1"></td></tr>
      <tr><td><input type="text" aria-label="Hallazgo 2"></td><td><input type="text" aria-label="Tiene eje 2"></td><td><input type="text" aria-label="Calza al girar 2"></td><td><input type="text" aria-label="Clase de simetría 2"></td></tr>
      <tr><td><input type="text" aria-label="Hallazgo 3"></td><td><input type="text" aria-label="Tiene eje 3"></td><td><input type="text" aria-label="Calza al girar 3"></td><td><input type="text" aria-label="Clase de simetría 3"></td></tr>
    </table>
    <div class="campo"><label>Mi conclusión: ¿por qué una figura puede tener espejo y giro a la vez, y otra solo una de las dos? <input type="text"></label></div>
    <div class="caja reto"><b>Reto extra:</b> un cuadrado, ¿cuántos ejes de simetría tiene? ¿Y un círculo? Compruébalo doblando papel y prepárate para sorprenderte.</div>
  </article>

  <article class="pagina">
    <h2><span class="num">4</span>Creo, mi obra simétrica</h2>
    <p>Ahora creas tu propia obra simétrica. Elige un camino:</p>
    <ol class="pasos">
      <li><b>Camino A, mandala radial:</b> marca un centro y un motivo (un pétalo, una figura). Repítelo girándolo alrededor del centro 4, 6 u 8 veces, siempre el mismo ángulo. Obtendrás un rosetón con simetría radial, y si tu motivo también se refleja, tendrá las dos a la vez.</li>
      <li><b>Camino B, composición bilateral:</b> parte de una muestra real de tu expedición (una hoja, una reja). Dibuja la mitad a un lado del eje y refléjala al otro lado, como si el eje fuera un espejo. Dobla el papel para comprobar que coincide.</li>
    </ol>
    <div class="caja mati"><b>Antes de dibujar en papel:</b> ensaya tu idea en Espejos Vivos, con 1, 2 o 4 ejes. Te ahorra borrones.</div>
  </article>

  <article class="pagina">
    <h2>Boceto de mi obra</h2>
    <p class="etiqueta">Dibújalo y marca sus ejes. Materiales: papel, regla, lápiz, colores y un espejito.</p>
    <div class="boceto">Dibuja aquí en la hoja impresa</div>
  </article>

  <article class="pagina">
    <h2><span class="num">5</span>Socializo, rumbo a ExpoLIVIMA</h2>
    <p>Las obras del grupo se unen en un "Mapa simétrico del colegio": dónde cazó cada equipo sus simetrías y qué obra creó con ellas. Completa la ficha de tu obra:</p>
    <div class="cartela">
      <label>Título de mi obra: <input type="text"></label>
      <label>Tipo de simetría y número de ejes: <input type="text"></label>
      <label>Muestra o lugar que la inspiró: <input type="text"></label>
      <label>Lo que quise expresar: <input type="text"></label>
    </div>
    <div class="caja reto"><b>Tu reto final: insignia Explorador de Simetrías.</b> Entrega tu bitácora con al menos 4 hallazgos, la tabla de clasificación y tu obra con su ficha. Y responde en una frase: ¿puede una figura tener espejo y giro a la vez? Da un ejemplo.</div>
    <div class="campo"><label>Mi respuesta: <input type="text"></label></div>
  </article>

  <article class="pagina">
    <h2>Cómo reviso mi trabajo</h2>
    <table>
      <tr><th>Criterio</th><th>Aún no</th><th>En proceso</th><th>Logrado</th></tr>
      <tr><td><b>Observo en el campo</b></td><td>Registro pocos hallazgos</td><td>Registro con ayuda</td><td>Lleno mi bitácora con hallazgos variados</td></tr>
      <tr><td><b>Compruebo la simetría</b></td><td>Decido a ojo</td><td>Uso el espejo o el doblez con ayuda</td><td>Verifico con espejo o doblez por mí mismo</td></tr>
      <tr><td><b>Clasifico la simetría</b></td><td>Confundo los tipos</td><td>Clasifico algunos casos</td><td>Distingo bilateral, radial, ambas y ninguna</td></tr>
      <tr><td><b>Creo con simetría</b></td><td>Mi obra no es simétrica</td><td>Es simétrica pero imprecisa</td><td>Es simétrica y marco bien los ejes</td></tr>
      <tr><td><b>Socializo mi hallazgo</b></td><td>No explico mi obra</td><td>Explico solo el arte</td><td>Explico el arte y la simetría que encontré</td></tr>
    </table>
  </article>

  <article class="pagina">
    <h2>Para seguir en casa</h2>
    <table>
      <tr><th>Observar</th><th>Preguntarte</th><th>Crear y compartir</th></tr>
      <tr>
        <td>Encuentra una simetría en tu casa (un plato, una ventana) y comprueba con el doblez o el espejito si es bilateral, radial o las dos.</td>
        <td>¿Por qué la naturaleza usa tanto la simetría en hojas, flores y animales? No busques la respuesta correcta, busca tu idea.</td>
        <td>Diseña otra obra con el camino que no elegiste y trae las dos al Observatorio LIVIMA.</td>
      </tr>
    </table>
    <p><b>Reto del explorador curioso:</b> guarda tus hallazgos en el Pasaporte del Explorador; en 8° volverás a usar la reflexión.</p>
  </article>
</template>
