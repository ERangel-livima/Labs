<script type="module">
import { THREE, hayWebGL, almacen, crearMundo, construirRonda, pisoDeParada, ALTO_PISO_PARADA, crearPortal, personajes, crearRecorrido } from "./3d/livima3d.js";
import { texturaLetrero, conLuz, puntal as puntalComun, totemDeParada, neon } from "./3d/piezas.js";
import { crearRincon, crearCruce, rumboHacia } from "./3d/rincon.js";

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const NAVY = "#1B3A6B", TEAL = "#1F8A8A", GREEN = "#4A9B2E", ORANGE = "#D9701A", PURPLE = "#6B3FA0";

/* ---------- los 8 hallazgos y sus pruebas: las mismas del simulador clásico ---------- */
function drawHoja(g){
  g.fillStyle="#3E8E22"; g.strokeStyle="#1F5410"; g.lineWidth=5;
  g.beginPath(); g.moveTo(210,66);
  g.bezierCurveTo(292,112, 300,224, 210,352);
  g.bezierCurveTo(120,224, 128,112, 210,66);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle="#CFE8B8"; g.lineWidth=3;
  g.beginPath(); g.moveTo(210,78); g.lineTo(210,340); g.stroke();
  g.lineWidth=2;
  [130,175,220,265].forEach((y,i)=>{
    const dx=58-i*8;
    g.beginPath(); g.moveTo(210,y); g.lineTo(210-dx,y+26); g.stroke();
    g.beginPath(); g.moveTo(210,y); g.lineTo(210+dx,y+26); g.stroke();
  });
}
function drawMariposa(g){
  g.fillStyle=PURPLE; g.globalAlpha=1;
  g.beginPath(); g.ellipse(146,166,54,44,-0.5,0,TAU); g.fill();
  g.beginPath(); g.ellipse(274,166,54,44,0.5,0,TAU); g.fill();
  g.fillStyle="#C25E10";
  g.beginPath(); g.ellipse(158,254,38,32,0.35,0,TAU); g.fill();
  g.beginPath(); g.ellipse(262,254,38,32,-0.35,0,TAU); g.fill();
  g.globalAlpha=1;
  g.fillStyle="#F5F1E4";
  g.beginPath(); g.arc(146,160,10,0,TAU); g.fill();
  g.beginPath(); g.arc(274,160,10,0,TAU); g.fill();
  g.fillStyle=NAVY;
  g.beginPath(); g.ellipse(210,206,11,52,0,0,TAU); g.fill();
  g.beginPath(); g.arc(210,142,11,0,TAU); g.fill();
  g.strokeStyle=NAVY; g.lineWidth=3;
  g.beginPath(); g.moveTo(204,134); g.quadraticCurveTo(186,102,172,96); g.stroke();
  g.beginPath(); g.moveTo(216,134); g.quadraticCurveTo(234,102,248,96); g.stroke();
}
function drawFlor(g){
  for(let k=0;k<5;k++){
    g.save(); g.translate(210,210); g.rotate(k*72*D2R);
    g.fillStyle="#5A2D91"; g.globalAlpha=1;
    g.beginPath(); g.ellipse(0,-78,30,64,0,0,TAU); g.fill();
    g.strokeStyle="#3B1A66"; g.lineWidth=3; g.stroke();
    g.globalAlpha=1; g.restore();
  }
  g.fillStyle="#E0A800"; g.beginPath(); g.arc(210,210,30,0,TAU); g.fill();
  g.strokeStyle="#8A6500"; g.lineWidth=4; g.stroke();
}
function drawReja(g){
  g.strokeStyle="#C25E10"; g.lineWidth=9;
  g.strokeRect(76,122,268,176);
  g.strokeStyle=NAVY; g.lineWidth=6;
  [116,163,210,257,304].forEach(x=>{ g.beginPath(); g.moveTo(x,132); g.lineTo(x,288); g.stroke(); });
  g.beginPath(); g.moveTo(86,210); g.lineTo(334,210); g.stroke();
  g.fillStyle=TEAL;
  [116,163,210,257,304].forEach(x=>{ g.beginPath(); g.arc(x,210,8,0,TAU); g.fill(); });
}
function drawTri(g){
  g.fillStyle="#2FA3A0"; g.strokeStyle="#0E5555"; g.lineWidth=7;
  g.beginPath(); g.moveTo(210,84); g.lineTo(319,273); g.lineTo(101,273); g.closePath();
  g.fill(); g.stroke();
  g.fillStyle="#0E5555"; g.beginPath(); g.arc(210,210,8,0,TAU); g.fill();
}
function drawCua(g){
  g.fillStyle="#4F78BE"; g.strokeStyle=NAVY; g.lineWidth=7;
  g.fillRect(112,112,196,196); g.strokeRect(112,112,196,196);
  g.strokeStyle="#F5F1E4"; g.lineWidth=5;
  g.beginPath(); g.moveTo(210,112); g.lineTo(308,210); g.lineTo(210,308); g.lineTo(112,210); g.closePath(); g.stroke();
}
function drawCopo(g){
  // copo de nieve: 6 brazos con ramitas y un hexágono al centro (6 ejes, calza cada 60°)
  const C=210, arms=[], OUT="#123F7A", FILL="#2F6FC0", HI="#9CC4F0";
  for(let k=0;k<6;k++){
    const a=(-90+k*60)*D2R, ux=Math.cos(a), uy=Math.sin(a);
    const seg=[[C+ux*36,C+uy*36,C+ux*150,C+uy*150]];
    [[74,40],[114,30]].forEach(([d,l])=>{
      const bx=C+ux*d, by=C+uy*d;
      [-1,1].forEach(s=>{ const b=a+s*48*D2R; seg.push([bx,by,bx+Math.cos(b)*l,by+Math.sin(b)*l]); });
    });
    arms.push(seg);
  }
  const strokeAll=(col,w)=>{ g.strokeStyle=col; g.lineWidth=w; g.lineCap="round";
    arms.forEach(seg=>seg.forEach(([x1,y1,x2,y2])=>{ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); })); };
  strokeAll(OUT,20); strokeAll(FILL,13); strokeAll(HI,3);
  const hex=(r)=>{ g.beginPath(); for(let k=0;k<6;k++){ const a=(-90+k*60)*D2R; const x=C+Math.cos(a)*r, y=C+Math.sin(a)*r; k?g.lineTo(x,y):g.moveTo(x,y); } g.closePath(); };
  hex(40); g.fillStyle=FILL; g.fill(); g.lineWidth=5; g.strokeStyle=OUT; g.lineJoin="round"; g.stroke();
  hex(22); g.fillStyle=HI; g.fill(); g.lineWidth=3; g.strokeStyle=OUT; g.stroke();
}
function drawRemo(g){
  // remolino: 4 aspas curvas iguales (calza cada 90°, ningún espejo lo deja igual)
  const blade=()=>{ g.beginPath(); g.moveTo(-6,-22);
    g.bezierCurveTo(70,-34, 104,-96, 54,-150);
    g.bezierCurveTo(50,-146, 46,-144, 44,-140);
    g.bezierCurveTo(70,-98, 40,-52, -14,-34);
    g.closePath(); };
  for(let k=0;k<4;k++){
    g.save(); g.translate(210,210); g.rotate(k*90*D2R);
    blade(); g.fillStyle="#6A35B5"; g.fill();
    g.lineWidth=7; g.lineJoin="round"; g.strokeStyle="#3B1A66"; g.stroke();
    g.beginPath(); g.moveTo(8,-32); g.bezierCurveTo(58,-44, 82,-90, 58,-128);
    g.lineWidth=5; g.lineCap="round"; g.strokeStyle="rgba(255,255,255,0.45)"; g.stroke();
    g.restore();
  }
  g.fillStyle=NAVY; g.beginPath(); g.arc(210,210,16,0,TAU); g.fill();
  g.fillStyle="rgba(255,255,255,0.5)"; g.beginPath(); g.arc(205,204,5,0,TAU); g.fill();
}
// articulo: para decir "la hoja", "el remolino" en los mensajes
const FIGS = [
  { id:"hoja", corto:"Hoja",     name:"Hoja",              art:"la",  axes:[90],                 order:1, draw:drawHoja,
    exp:"Tiene 1 eje de espejo (vertical) y no calza al girar: simetría bilateral, la de casi todo lo vivo." },
  { id:"mariposa", corto:"Mariposa", name:"Mariposa",          art:"la",  axes:[90],                 order:1, draw:drawMariposa,
    exp:"Un solo eje vertical, como tu cara en el espejo: bilateral." },
  { id:"flor", corto:"Flor",     name:"Flor de 5 pétalos", art:"la",  axes:[18,54,90,126,162],   order:5, draw:drawFlor,
    exp:"5 ejes de espejo y calza cada 72 grados: tiene espejo y giro, las dos." },
  { id:"reja", corto:"Reja",     name:"Reja del barrio",   art:"la",  axes:[0,90],               order:2, draw:drawReja,
    exp:"2 ejes (horizontal y vertical) y calza al girar 180 grados: las dos simetrías." },
  { id:"tri", corto:"Triángulo",      name:"Triángulo",         art:"el",  axes:[30,90,150],          order:3, draw:drawTri,
    exp:"3 ejes de espejo y calza cada 120 grados: espejo y giro." },
  { id:"cua", corto:"Cuadrado",      name:"Cuadrado",          art:"el",  axes:[0,45,90,135],        order:4, draw:drawCua,
    exp:"4 ejes de espejo y calza cada 90 grados: espejo y giro." },
  { id:"copo", corto:"Copo",     name:"Copo de 6 puntas",  art:"el",  axes:[0,30,60,90,120,150], order:6, draw:drawCopo,
    exp:"6 ejes y calza cada 60 grados: la reina del espejo y el giro." },
  { id:"remo", corto:"Remolino",     name:"Remolino",          art:"el",  axes:[],                   order:4, draw:drawRemo,
    exp:"Calza cada 90 grados pero ningún espejo lo deja igual: simetría radial pura. La trampa del detective." }
];
const nombreCon = f => `${f.art} ${f.name.charAt(0).toLowerCase()}${f.name.slice(1)}`;
const mayuscula = s => s.charAt(0).toUpperCase() + s.slice(1);
const CESTAS = [
  { id: "bilateral", texto: "Solo espejo" },
  { id: "radial",    texto: "Solo giro" },
  { id: "ambas",     texto: "Espejo y giro" },
  { id: "ninguna",   texto: "Ninguna" }
];
function clase(f) {
  const conEje = f.axes.length > 0, conGiro = f.order > 1;
  return conEje && conGiro ? "ambas" : conEje ? "bilateral" : conGiro ? "radial" : "ninguna";
}
// tolerancias del clásico: grados para el espejo y el giro, píxeles para el corrimiento del eje
const TOL_ESPEJO = 4, TOL_GIRO = 5, TOL_CORRER = 8;
const INSIGNIA_EN = 5;
const normalEje = a => ((a % 180) + 180) % 180;
const cercaDeEje = (f, a) => f.axes.find(ax => { const d = Math.abs(normalEje(a) - ax); return Math.min(d, 180 - d) <= TOL_ESPEJO; });
function ejeQueCalza(f, a, correr) { return Math.abs(correr) > TOL_CORRER ? undefined : cercaDeEje(f, a); }
function giroQueCalza(f, a) {
  if (f.order < 2) return undefined;
  const paso = 360 / f.order;
  for (let k = 1; k < f.order; k++) if (Math.abs(a - k * paso) <= TOL_GIRO) return k * paso;
  return undefined;
}

/* ---------- sonido corto y suave, como en el clásico ---------- */
let audio = null;
function tono(freq, t0, dur, vol, tipo = "sine") {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + t0;
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (error) { console.warn("LIVIMA: este navegador no dejó sonar el aviso", error); audio = null; }
}
const sonarEje = () => { tono(880, 0, 0.12, 0.11); tono(1320, 0.07, 0.15, 0.09); };
const sonarGiro = () => { tono(660, 0, 0.12, 0.11); tono(990, 0.07, 0.15, 0.09); };
const sonarBien = () => { tono(523, 0, 0.12, 0.11); tono(659, 0.09, 0.12, 0.11); tono(784, 0.18, 0.2, 0.11); };
const sonarNo = () => tono(220, 0, 0.18, 0.09, "triangle");

/* ---------- estado del estudiante ---------- */
const guardado = almacen("livima_detector3d");
const ESTADO = FIGS.map(() => ({ ejes: [], giro: null, hecho: false }));
const mesa = { fig: 0, prueba: "espejo", angulo: 20, correr: 0, llevando: null };
let ultimoEje = false, ultimoGiro = false;
function guardar() {
  if (!guardado.guardar({ estado: ESTADO, fig: mesa.fig })) avisarUnaVez("Este navegador no deja guardar: tus hallazgos siguen aquí, pero se perderán si cierras la página.");
}
function recuperar() {
  const previo = guardado.leer();
  if (!previo || !Array.isArray(previo.estado) || previo.estado.length !== FIGS.length) return false;
  previo.estado.forEach((s, i) => Object.assign(ESTADO[i], { ejes: Array.isArray(s.ejes) ? s.ejes : [], giro: s.giro ?? null, hecho: !!s.hecho }));
  mesa.fig = Number.isInteger(previo.fig) && !ESTADO[previo.fig]?.hecho ? previo.fig : siguientePendiente();
  return ESTADO.some(s => s.hecho || s.ejes.length || s.giro !== null);

function moverPiezasDeLaMesa() {

  const t = mesa.angulo * D2R;
  if (mesa.prueba === "espejo") {
    // en el lienzo, x va a la derecha y y hacia el estudiante: así se pasa a la mesa
    espejo.rotation.y = -t;
    espejo.position.x = -Math.sin(t) * mesa.correr * METROS_POR_PIXEL;

    marco.forEach(m => { m.material = calza ? marcoCalza : marcoApagado; });

// la tornamesa se ve desde arriba, de forma perpendicular: los giros y los reflejos se leen sin deformarse.
// Se encuadra en el espacio que deja libre el panel, a la derecha en pantallas anchas o abajo en el celular.
// con un lente estrecho, desde más lejos, casi no hay perspectiva: el espejo se ve como una línea sobre el eje
const DISTANCIA_MAX_MESA = 12, LENTE_MESA = 20, LENTE_NORMAL = 45, ALTO_ESPEJO_DESDE_ARRIBA = 0.25;
function vistaDeMesa(activa) {
  if (!mundo) return;
  mundo.camara.fov = activa ? LENTE_MESA : LENTE_NORMAL; mundo.camara.updateProjectionMatrix();
  if (piezasMesa) piezasMesa.espejo.scale.y = activa ? ALTO_ESPEJO_DESDE_ARRIBA : 1;
}
const panelAlLado = () => matchMedia("(min-width: 760px)").matches;
function encuadrarMesa(ms = 900) {
  const panel = $("panelMesa").getBoundingClientRect(), arriba = document.querySelector(".hud").getBoundingClientRect().bottom + 6;
  // el rectángulo libre de la pantalla, en píxeles
  const libre = panelAlLado()
    ? { x0: 0, x1: Math.max(innerWidth * 0.3, panel.left - 12), y0: arriba, y1: innerHeight }
    : { x0: 0, x1: innerWidth, y0: arriba, y1: Math.max(arriba + innerHeight * 0.25, panel.top - 12) };
  const tanMedio = Math.tan(THREE.MathUtils.degToRad(mundo.camara.fov / 2)), aspecto = innerWidth / innerHeight;
  const fraccionAncho = (libre.x1 - libre.x0) / innerWidth, fraccionAlto = (libre.y1 - libre.y0) / innerHeight;
  const TAM = (MESA.radioTornamesa + 0.11) * 2;
  const distancia = Math.min(DISTANCIA_MAX_MESA, Math.max(0.9, TAM / (fraccionAlto * 2 * tanMedio), TAM / (fraccionAncho * 2 * tanMedio * aspecto)));
  // la cámara se corre para que la tornamesa quede en el centro del rectángulo libre (arriba de la pantalla es el fondo de la mesa)
  const nx = ((libre.x0 + libre.x1) / innerWidth) - 1, ny = 1 - ((libre.y0 + libre.y1) / innerHeight);
  const mitadAlto = distancia * tanMedio, mitadAncho = mitadAlto * aspecto;
  const y = ALTO_PISO_PARADA + MESA.alto + 0.08, cx = MESA.x - nx * mitadAncho, cz = MESA.z + ny * mitadAlto;
  // un pelo hacia la llegada, para que la cámara sepa dónde es "arriba" al mirar recto hacia abajo
  return mundo.viajar(new THREE.Vector3(cx, y + distancia, cz + distancia * 0.001), new THREE.Vector3(cx, y, cz), ms);
}

    texto: () => `Llevar ${nombreCon(f)} a la mesa`, accion: () => { ponerEnLaMesa(i); irAMesa(); } })),
  { id: "mesa", x: MESA.x, z: MESA.z, radio: 1.9, cuando: () => mesa.llevando === null, texto: () => "Usar la mesa del detective", accion: () => irAMesa() },
  { id: "portal", x: PORTAL.x, z: PORTAL.z, radio: 1.6, texto: () => "Volver a la ronda", accion: () => cruzarPortal("index.html#g6") }
  // el portal del juego y el atril se agregan al construir el rincón
];
const textoDe = l => typeof l.texto === "function" ? l.texto() : l.texto;
function actualizarCerca(x, z, forzar = false) {
  let nuevo = null;
  for (const l of LUGARES) if ((!l.cuando || l.cuando()) && Math.hypot(x - l.x, z - l.z) < l.radio) { nuevo = l; break; }
  if (nuevo === cerca && !forzar) return;
  cerca = nuevo;
  const porDefecto = mesa.llevando !== null ? "Busca la cesta" : "Ir a la mesa";
  $("btnAccion").textContent = cerca ? textoDe(cerca) + (ES_TACTIL ? "" : " (E)") : porDefecto;
}
$("btnAccion").onclick = () => {
  $("globo").hidden = true;
  if (cerca) { cerca.accion(); return; }
  if (mesa.llevando !== null) { decirMati("Camina hasta una de las cuatro cestas, a la izquierda de la mesa, y deja ahí el hallazgo.", { segundos: 6 }); return; }
  irAMesa();
};
addEventListener("keydown", e => {
  if (e.code !== "KeyE" || !recorrido || !recorrido.activo || !cerca || e.target.closest("input, textarea")) return;
  e.preventDefault(); $("globo").hidden = true; cerca.accion();
});
let ultimaPos = { x: 0, z: 0 };
function moverMati({ x, y, z, rumbo, vel, tercera, dt }) {
  ultimaPos = { x, z };
  actualizarCerca(x, z);
  R_MATI.raiz.visible = tercera;
  R_MATI.raiz.position.set(x, y, z);
  let giro = rumbo - R_MATI.raiz.rotation.y; giro = Math.atan2(Math.sin(giro), Math.cos(giro));
  R_MATI.raiz.rotation.y += giro * Math.min(1, dt * 9);
  guias.animarPersonaje(R_MATI, mundo.reloj.t, dt, vel);
}
$("btnVista").onclick = () => {
  const atras = !recorrido.tercera; recorrido.verDesdeAtras(atras);
  $("btnVista").setAttribute("aria-pressed", String(atras)); $("btnVista").textContent = atras ? "Ver con mis ojos" : "Ver a Mati";
  $("btnVista").blur();   // el foco vuelve a la escena: se sigue caminando sin tocar otra parte
};
$("btnSalto").hidden = !ES_TACTIL;
$("btnSalto").onclick = () => recorrido.saltar();
async function irARecorrido(inicio) {
  if (!recorrido) return;
  mostrarPanel("recorrido");
  cerca = undefined; actualizarCerca(inicio ? inicio.x : ultimaPos.x, inicio ? inicio.z : ultimaPos.z, true);
  await recorrido.activar(inicio);
}
document.querySelectorAll("[data-recorrer]").forEach(b => b.onclick = () => { $("globo").hidden = true; irARecorrido({ x: MESA.x, z: MESA.z + 1.6, yaw: rumboHacia(0, -1), ms: 700 }); });

/* ---------- el portal del juego, el atril y el cruce de portales (3d/rincon.js) ---------- */
const cruzarPortal = (destino, opciones = {}) => cruce.cruzar(destino, { puerta: portal, ...opciones });
document.querySelector(".hud .volver").addEventListener("click", e => { e.preventDefault(); cruzarPortal(e.currentTarget.getAttribute("href")); });

/* ---------- arranque ---------- */
const habiaAvance = recuperar();
const antesDeCruzar = () => { $("globo").hidden = true; cerrarHojas(); mostrarPanel("cruce"); if (recorrido) recorrido.desactivar(); };
marcarHallazgos();
if (usarLigera) {
  rincon = crearRincon(null, OPCIONES_RINCON);
  cruce = crearCruce({ mundo: null, antes: antesDeCruzar });
  $("mundo").hidden = true; $("ligera").append(lienzoMesa);
  document.querySelectorAll("[data-recorrer]").forEach(b => { b.hidden = true; });
  // en la vista ligera no hay estantería ni cestas que caminar: se eligen con botones
  $("btnLlevar").textContent = "Clasificar";
  $("velo").classList.remove("on");
  if (!hayWebGL()) avisar("Este equipo no pudo abrir el 3D: estás en la vista ligera, con las mismas pruebas.");
  if (mesa.fig === null) mesa.fig = siguientePendiente();
  irAMesa();
  decirMati(habiaAvance ? "Aquí están tus hallazgos, tal como los dejaste." : "Ponle el espejo al hallazgo: si al reflejarlo queda igual, encontraste un eje. Luego gíralo: si calza antes de la vuelta completa, tiene simetría de giro.", { segundos: 9 });
} else {
  mundo = crearMundo($("mundo"), { slot: 4 });
  const zonaLibre = (x, z) => x > -4 && x < 8 && z > 4 && z < 18;   // la salida del portal queda despejada
  ({ troncos } = construirRonda(mundo, { zonaLibre }));
  const { postes } = construirEstacion();
  cruce = crearCruce({ mundo, antes: antesDeCruzar, alVolver: () => { rincon.apagar(); irARecorrido(); } });
  recorrido = crearRecorrido(mundo, {
    limites: { xMin: -60, xMax: 60, zMin: -40, zMax: 60 },
    permitido: (x, z) => z > mundo.rioLocal(x) + 7.5,   // se puede llegar a la playa, pero no meterse al río
    piso: (x, z) => {
      if (Math.hypot(x, z) < 5.4) return ALTO_PISO_PARADA;
      const enLaLosa = rincon.piso(x, z); if (enLaLosa !== null) return enLaLosa;
      return mundo.alturaLocal(x, z);
    },
    alMoverse: moverMati,
    circulos: [
      ...troncos,
      ...postes.map(p => [p.x, p.z, 0.3]),
      [MESA.x, MESA.z, 0.68],
      ...POS_PEDESTALES.map(p => [p.x, p.z, 0.3]),
      ...POS_CESTAS.map(p => [p.x, p.z, 0.42]),
      [PORTAL.x, PORTAL.z, 0.8], [MOLINO.x, MOLINO.z, 2.2 * MOLINO.escala],
      ...rincon.circulos
    ]
  });
  actualizarMesa();
  // se sale por donde se entró: el portal del mapa, el del juego o el atril de la guía
  const desde = new URLSearchParams(location.search).get("desde");
  const { puerta, paso } = rincon.puertaDeLlegada(desde, portal);
  mundo.colocar(puerta.centro.clone().addScaledVector(puerta.normal, -0.6), puerta.centro.clone().addScaledVector(puerta.normal, 4));
  // se llega viendo a Mati desde atrás: un paso más lejos, para que la cámara no quede dentro del portal
  const salida = puerta.centro.clone().addScaledVector(puerta.normal, paso + PASO_EXTRA_TERCERA);
  requestAnimationFrame(() => requestAnimationFrame(async () => {
    $("velo").classList.remove("on");
    await irARecorrido({ x: salida.x, z: salida.z, yaw: Math.atan2(-puerta.normal.x, -puerta.normal.z), ms: 1500 });
    if (!desde) decirMati(habiaAvance ? `Ya clasificaste ${clasificados()} de ${FIGS.length} hallazgos. ` + PISTA_CAMINAR : PISTA_CAMINAR, { segundos: 12 });
  }));
}
window.__estacion = { get mundo() { return mundo; }, get recorrido() { return recorrido; }, mesa, ESTADO, irAMesa, clasificar, ponerEnLaMesa };   // para las pruebas automáticas
window.__listo = true;
</script>
</body>
</html>
