<style>

  :root{

  *{box-sizing:border-box}

<script type="module">
import { THREE, hayWebGL, almacen, crearMundo, construirRonda, pisoDeParada, ALTO_PISO_PARADA, crearPortal, personajes, crearRecorrido } from "./3d/livima3d.js";

const ESTACION = { id: "espejos", acento: "#4A9B2E", clave: "livima_espejos3d_obra" };
const COLORES = ["#1B3A6B", "#1F8A8A", "#4A9B2E", "#D9701A", "#6B3FA0", "#C0392B", "#E8B800", "#111111"];
const CUADRO = 40;                  // un cuadro de la cuadrícula, en unidades del lienzo
const ANCHO_U = 800, ALTO_U = 600;  // el lienzo mide 20 x 15 cuadros; el centro es (0, 0)
const PX_ANCHO = 1024, PX_ALTO = 768;
const DISTANCIA_MIN_PUNTOS = 1.5;   // no se guardan puntos más cercanos: el trazo pesa menos

// los mismos reflejos del simulador clásico: eje vertical; más el horizontal; más las dos diagonales
const REFLEJOS = {
  1: [(x, y) => [x, y], (x, y) => [-x, y]],
  2: [(x, y) => [x, y], (x, y) => [-x, y], (x, y) => [x, -y], (x, y) => [-x, -y]],
  4: [(x, y) => [x, y], (x, y) => [-x, y], (x, y) => [x, -y], (x, y) => [-x, -y],
      (x, y) => [y, x], (x, y) => [-y, x], (x, y) => [y, -x], (x, y) => [-y, -x]]
};

const elipse = (cx, cy, rx, ry, a0, a1, n = 24) =>
  Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });

// Cada muestra trae solo su parte base: el calco que el estudiante repasa. Los ejes hacen el resto.
const MUESTRAS = {
  babilla: { ejes: 1, nombre: "Babilla", nota: "1 eje",
    pista: "La babilla tiene un solo eje: va de la trompa a la cola. Calca la mitad marcada y mira cómo el espejo la completa.",
    trazos: [
      { c: "#4A9B2E", a: 10, p: [[0,-272],[-16,-262],[-22,-222],[-30,-186],[-42,-174],[-36,-150],[-34,-128],[-60,-92],[-70,-20],[-62,48],[-40,100],[-26,150],[-12,222],[0,282]] },
      { c: "#4A9B2E", a: 9, p: [[-58,-82],[-104,-106],[-122,-100]] }, { c: "#4A9B2E", a: 6, p: [[-104,-106],[-112,-124]] },
      { c: "#4A9B2E", a: 9, p: [[-62,40],[-108,66],[-126,60]] }, { c: "#4A9B2E", a: 6, p: [[-108,66],[-118,84]] },
      ...[-60, -34, -8, 18, 44, 70].map(y => ({ c: "#1F8A8A", a: 6, p: [[-8,y],[-40,y+8]] })),
      { c: "#1F8A8A", a: 5, p: [[-6,118],[-24,124]] }, { c: "#1F8A8A", a: 5, p: [[-4,168],[-16,172]] },
      { c: "#D9701A", a: 7, p: elipse(-30, -172, 7, 7, 0, 6.3, 12) }
    ] },
  bocachicos: { ejes: 2, nombre: "Bocachicos en ronda", nota: "2 ejes",
    pista: "Dibuja un solo bocachico arriba a la izquierda. Con 2 ejes, un pez se vuelve cuatro: nariz con nariz y de arriba a abajo.",
    trazos: [
      { c: "#1F8A8A", a: 9, p: elipse(-130, -120, 100, 40, 0, 6.3, 36) },
      { c: "#D9701A", a: 8, p: [[-228,-120],[-280,-162],[-266,-120],[-280,-78],[-228,-120]] },
      { c: "#D9701A", a: 7, p: [[-160,-158],[-130,-186],[-100,-158]] },
      { c: "#1B3A6B", a: 6, p: elipse(-62, -130, 7, 7, 0, 6.3, 12) },
      { c: "#1F8A8A", a: 5, p: elipse(-150, -120, 18, 26, -1.2, 1.2, 10) }, { c: "#1F8A8A", a: 5, p: elipse(-185, -120, 18, 26, -1.2, 1.2, 10) },
      { c: "#6B3FA0", a: 6, p: elipse(0, 0, 46, 46, Math.PI, 1.5 * Math.PI, 12) }
    ] },
  hicoteas: { ejes: 4, nombre: "Ronda de hicoteas", nota: "4 ejes",
    pista: "Con 4 ejes basta media hicotea y media flor de buchón: el espejo arma la ronda completa.",
    trazos: [
      { c: "#4A9B2E", a: 9, p: elipse(0, -182, 58, 62, -Math.PI / 2, -1.5 * Math.PI, 24) },
      { c: "#1F8A8A", a: 6, p: [[0,-210],[-26,-196],[-26,-166],[0,-152]] },
      { c: "#1F8A8A", a: 5, p: [[-26,-196],[-50,-210]] }, { c: "#1F8A8A", a: 5, p: [[-26,-166],[-52,-150]] },
      { c: "#4A9B2E", a: 8, p: [[0,-246],[-14,-252],[-18,-270],[-8,-284],[0,-286]] },
      { c: "#D9701A", a: 5, p: [[-6,-262],[-12,-272]] },
      { c: "#4A9B2E", a: 8, p: [[-48,-214],[-84,-236],[-80,-212],[-56,-200]] },
      { c: "#4A9B2E", a: 8, p: [[-44,-146],[-72,-122],[-52,-116],[-36,-128]] },
      { c: "#4A9B2E", a: 6, p: [[0,-120],[-6,-110],[0,-102]] },
      { c: "#6B3FA0", a: 8, p: [[-92,-92],[-104,-134],[-152,-152]] },
      { c: "#6B3FA0", a: 6, p: [[-112,-112],[-118,-132],[-138,-138]] },
      { c: "#1B3A6B", a: 7, p: elipse(0, 0, 38, 38, -Math.PI / 2, -0.75 * Math.PI, 6) }
    ] },
  blanco: { ejes: 1, nombre: "Lienzo en blanco", nota: "Tu creación", pista: "El bastidor está en blanco: dibuja lo que imagines y el espejo lo completa.", trazos: [] }
};

const $ = id => document.getElementById(id);
const guardado = almacen(ESTACION.clave);
// el bastidor empieza en blanco: las criaturas del Sinú son ideas opcionales, no una plantilla
const estado = { vista: "llegada", ejes: 1, color: COLORES[2], grosor: 8, muestra: "blanco", trazos: [], nombre: "" };

/* ---------- el lienzo: se pinta en 2D y la misma imagen va al bastidor 3D ---------- */
const nuevoCanvas = () => { const c = document.createElement("canvas"); c.width = PX_ANCHO; c.height = PX_ALTO; return c; };
const lienzoTrabajo = nuevoCanvas();   // con el calco de la muestra
const lienzoObra = nuevoCanvas();      // la obra limpia, para la galería y la descarga
const ESCALA = PX_ALTO / ALTO_U;
const aPx = (x, y) => [PX_ANCHO / 2 + x * ESCALA, PX_ALTO / 2 + y * ESCALA];

function pintarFondo(ctx, conCuadricula) {
  ctx.fillStyle = "#FBFAF6"; ctx.fillRect(0, 0, PX_ANCHO, PX_ALTO);
  if (!conCuadricula) return;
  ctx.strokeStyle = "#1B3A6B22"; ctx.lineWidth = 1.5;
  const paso = CUADRO * ESCALA;
  for (let x = (PX_ANCHO / 2) % paso; x < PX_ANCHO; x += paso) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, PX_ALTO); ctx.stroke(); }
  for (let y = (PX_ALTO / 2) % paso; y < PX_ALTO; y += paso) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(PX_ANCHO, y); ctx.stroke(); }
}
function pintarEjes(ctx, ejes) {
  const cx = PX_ANCHO / 2, cy = PX_ALTO / 2, mitad = PX_ALTO / 2;
  const linea = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = "#9aa3ad"; ctx.lineWidth = 3;
  linea(cx, 0, cx, PX_ALTO);
  if (ejes >= 2) linea(0, cy, PX_ANCHO, cy);
  if (ejes === 4) { linea(cx - mitad, 0, cx + mitad, PX_ALTO); linea(cx + mitad, 0, cx - mitad, PX_ALTO); }
  ctx.restore();
}
function pintarTrazo(ctx, trazo, reflejos = REFLEJOS[trazo.ejes]) {
  ctx.strokeStyle = trazo.color; ctx.lineWidth = trazo.grosor * ESCALA; ctx.lineCap = ctx.lineJoin = "round";
  reflejos.forEach(t => {
    ctx.beginPath();
    trazo.puntos.forEach(([x, y], i) => { const [px, py] = aPx(...t(x, y)); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    if (trazo.puntos.length === 1) { const [px, py] = aPx(...t(...trazo.puntos[0])); ctx.lineTo(px + 0.01, py); }
    ctx.stroke();
  });
}
function pintarCalco(ctx, muestra) {
  ctx.save(); ctx.globalAlpha = 0.28;
  muestra.trazos.forEach(({ c, a, p }) => pintarTrazo(ctx, { color: c, grosor: a, puntos: p }, [REFLEJOS[1][0]]));
  ctx.restore();
}
const pintarMuestraCompleta = (ctx, muestra) =>
  muestra.trazos.forEach(({ c, a, p }) => pintarTrazo(ctx, { color: c, grosor: a, puntos: p, ejes: muestra.ejes }));

function pintarObra(ctx) {
  pintarFondo(ctx, false); pintarEjes(ctx, estado.ejes);
  estado.trazos.forEach(t => pintarTrazo(ctx, t));
}
function redibujarTrabajo() {
  const ctx = lienzoTrabajo.getContext("2d");
  pintarFondo(ctx, false); pintarEjes(ctx, estado.ejes); pintarCalco(ctx, MUESTRAS[estado.muestra]);
  estado.trazos.forEach(t => pintarTrazo(ctx, t));
  avisarCambioLienzo();
}

/* ---------- mensajes de Mati y avisos ---------- */
let globoTimer = 0;
// el globo y los avisos van justo debajo de la barra de arriba, que en un celular puede ocupar dos líneas

/* ---------- guardar y recuperar la obra ---------- */
let yaAvisoGuardado = false;
function guardarObra() {
  const ok = guardado.guardar({ ejes: estado.ejes, muestra: estado.muestra, trazos: estado.trazos, nombre: estado.nombre, color: estado.color, grosor: estado.grosor });
  if (!ok && !yaAvisoGuardado) { yaAvisoGuardado = true; avisar("Este navegador no deja guardar: tu obra sigue aquí, pero se perderá si cierras la página. Descárgala al terminar."); }
}
function recuperarObra() {
  const previo = guardado.leer();
  if (!previo || !Array.isArray(previo.trazos)) return false;
  Object.assign(estado, previo, { muestra: MUESTRAS[previo.muestra] ? previo.muestra : "blanco" });
  return estado.trazos.length > 0;
}

// El caballete del stand de Espejos Vivos en el mapa: patas, repisa, travesaño y bastidor.
function caballete(escala, x, z, giro) {
  const { M, malla, escena } = mundo, madera = M("#7A5230"), marco = M("#8A6A44");
  const g = new THREE.Group(); g.position.set(x, ALTO_PISO_PARADA, z); g.rotation.y = giro; g.scale.setScalar(escala); escena.add(g);
  [[-1.8, 0.18], [1.8, -0.18]].forEach(([px, r]) => { malla(new THREE.CylinderGeometry(0.09, 0.14, 7, 10), madera, px, 3.4, 0, g).rotation.z = r; });
  malla(new THREE.CylinderGeometry(0.09, 0.13, 6.4, 10), madera, 0, 3.1, -1.4, g).rotation.x = -0.25;
  malla(new THREE.BoxGeometry(7, 0.2, 0.55), madera, 0, 2.0, 0.3, g); malla(new THREE.BoxGeometry(3.4, 0.16, 0.16), M("#5c3d22"), 0, 1.0, 0, g);
  [[7.18], [2.02]].forEach(([py]) => malla(new THREE.BoxGeometry(6.7, 0.18, 0.34), marco, 0, py + 0.1, 0.1, g));
  [-3.28, 3.28].forEach(px => malla(new THREE.BoxGeometry(0.18, 5.2, 0.34), marco, px, 4.6, 0.1, g));
  malla(new THREE.BoxGeometry(6.4, 4.8, 0.25), M("#FBF6EA"), 0, 4.6, 0.1, g);
  // la tela: un plano 4:3 sobre el lienzo, como el lienzo del simulador
  const lamina = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 4.8), new THREE.MeshStandardMaterial({ color: "#d5d0c4" }));
  lamina.position.set(0, 4.6, 0.232); lamina.receiveShadow = true; g.add(lamina);
  return lamina;
}
// banco del pintor del mapa: paleta, tarro de agua y pinceles
function bancoDelPintor(x, z, giro) {
  const { M, malla, escena } = mundo;
  const st = new THREE.Group(); st.position.set(x, ALTO_PISO_PARADA, z); st.rotation.y = giro; st.scale.setScalar(0.8); escena.add(st);
  malla(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 16), M("#8A6A44"), 0, 1.0, 0, st);
  [0, 2.1, 4.2].forEach(a => malla(new THREE.CylinderGeometry(0.05, 0.06, 1.0, 6), M("#6E4E2E"), Math.cos(a) * 0.4, 0.5, Math.sin(a) * 0.4, st));
  malla(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 18), M("#C9A56A", { roughness: 0.7 }), -0.08, 1.08, 0.05, st).scale.z = 0.72;
  ["#D9533B", "#F4C542", "#3E7CC0", "#5FA845", "#8E5BB5"].forEach((c, k) => { malla(new THREE.SphereGeometry(0.07, 8, 6), M(c, { roughness: 0.4 }), -0.3 + k * 0.13, 1.11, 0.08 + Math.sin(k * 1.4) * 0.1, st).scale.y = 0.45; });
  malla(new THREE.CylinderGeometry(0.13, 0.11, 0.3, 10), M("#5C9DA3", { roughness: 0.3 }), 0.34, 1.2, -0.22, st);
  ["#D9533B", "#3E7CC0", "#F4C542"].forEach((c, k) => {
    const p = malla(new THREE.CylinderGeometry(0.014, 0.014, 0.6, 5), M("#8A6A44"), 0.31 + k * 0.03, 1.48, -0.22, st); p.rotation.z = (k - 1) * 0.22;
    malla(new THREE.ConeGeometry(0.03, 0.09, 6), M(c), 0.31 + k * 0.03 - (k - 1) * 0.07, 1.8, -0.22, st);
  });
}

function construirEstacion() {
  const { M, malla } = mundo;
  pisoDeParada(mundo, { radio: 6, color: "#8BD46A", tinta: "#2F6E1C" });
  texTrabajo = new THREE.CanvasTexture(lienzoTrabajo); texTrabajo.colorSpace = THREE.SRGBColorSpace; texTrabajo.anisotropy = 8;
  tela = caballete(BASTIDOR.escala, BASTIDOR.x, BASTIDOR.z, 0);
  tela.material = materialLamina(texTrabajo);
  bancoDelPintor(3.1, -2.1, -0.6);
  // el espejo de agua del stand, con su borde de piedra: refleja el cielo como el río copia la ceiba
  malla(new THREE.CylinderGeometry(ESTANQUE.r, ESTANQUE.r, 0.08, 40), M("#5C9DA3", { roughness: 0.06, metalness: 0.6 }), ESTANQUE.x, ALTO_PISO_PARADA + 0.03, ESTANQUE.z);
  malla(new THREE.TorusGeometry(ESTANQUE.r + 0.04, 0.09, 8, 40), new THREE.MeshStandardMaterial({ color: "#A8A296", roughness: 0.95 }), ESTANQUE.x, ALTO_PISO_PARADA + 0.07, ESTANQUE.z).rotation.x = Math.PI / 2;
  // galería: tres caballetes pequeños a un lado del stand
  texObra = new THREE.CanvasTexture(lienzoObra); texObra.colorSpace = THREE.SRGBColorSpace;
  cuadrosGaleria = GALERIA.zs.map(z => caballete(GALERIA.escala, GALERIA.x, z, Math.PI / 2));
  cuadrosGaleria[1].material = materialLamina(texObra);
  pintarObra(lienzoObra.getContext("2d")); texObra.needsUpdate = true;   // sin esto, el caballete vacío se vería negro
  colgarMuestrasEnGaleria();
  portal = crearPortal(mundo, { x: PORTAL.x, z: PORTAL.z, giro: Math.atan2(-PORTAL.x, -PORTAL.z), color: "#8BD46A" });
  // Mati, el mismo del mapa, en 3D
  guias = personajes(mundo);
  R_MATI = guias.crearPersonaje("mati"); R_MATI.raiz.visible = true;
  R_MATI.raiz.position.set(-1.2, ALTO_PISO_PARADA, 1.4);
  mundo.alAnimar.push(moverMatiPorCuadro);
}

// Mati camina hasta su lugar en cada vista y se voltea hacia quien llega
const LUGARES_MATI = {
  llegada: { x: -1.2, z: 1.4, mira: () => portal.centro },
  trabajo: { x: -1.95, z: -0.55, mira: () => new THREE.Vector3(0.6, 0, 4) },
  obra:    { x: -3.6,  z: 3.15, mira: () => new THREE.Vector3(2, 0, 0.4) }
};
let destinoMati = null;
const VELOCIDAD_MATI = 1.3;
function moverMatiPorCuadro(t, dt) {
  if (!R_MATI) return;
  const raiz = R_MATI.raiz;
  let vel = 0;
  if (destinoMati) {
    const dx = destinoMati.x - raiz.position.x, dz = destinoMati.z - raiz.position.z, d = Math.hypot(dx, dz);
    let rumbo;
    if (d > 0.04) {
      const paso = Math.min(d, VELOCIDAD_MATI * dt);
      raiz.position.x += dx / d * paso; raiz.position.z += dz / d * paso; vel = VELOCIDAD_MATI; rumbo = Math.atan2(dx, dz);
    } else {
      const m = destinoMati.mira(); rumbo = Math.atan2(m.x - raiz.position.x, m.z - raiz.position.z);
    }
    let giro = rumbo - raiz.rotation.y; giro = Math.atan2(Math.sin(giro), Math.cos(giro));
    raiz.rotation.y += giro * Math.min(1, dt * 6);
  }
  guias.animarPersonaje(R_MATI, t, dt, vel);
}

function colgarMuestrasEnGaleria() {
  const otras = Object.keys(MUESTRAS).filter(k => k !== "blanco" && k !== estado.muestra).slice(0, 2);
  [cuadrosGaleria[0], cuadrosGaleria[2]].forEach((lamina, i) => {
    const c = nuevoCanvas(), ctx = c.getContext("2d");
    pintarFondo(ctx, false); pintarEjes(ctx, MUESTRAS[otras[i]].ejes); pintarMuestraCompleta(ctx, MUESTRAS[otras[i]]);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    if (lamina.material.map) lamina.material.map.dispose();
    lamina.material = materialLamina(tex);
  });
}

/* ---------- dibujar con el dedo o el ratón ---------- */
const superficie = usarLigera ? lienzoTrabajo : $("mundo");
function puntoDelLienzo(evento) {
  let u, v;
  if (usarLigera) {
    const r = lienzoTrabajo.getBoundingClientRect();
    u = (evento.clientX - r.left) / r.width; v = 1 - (evento.clientY - r.top) / r.height;
    if (u < 0 || u > 1 || v < 0 || v > 1) return null;
  } else {
    const uv = mundo.uvBajoPuntero(evento, tela);
    if (!uv) return null;
    u = uv.x; v = uv.y;
  }
  return [(u - 0.5) * ANCHO_U, (0.5 - v) * ALTO_U];
}
let trazoActual = null;
superficie.addEventListener("pointerdown", e => {
  if (estado.vista !== "trabajo") return;
  const p = puntoDelLienzo(e); if (!p) return;
  superficie.setPointerCapture(e.pointerId);
  cerrarHojas(); $("globo").hidden = true;
  trazoActual = { color: estado.color, grosor: estado.grosor, ejes: estado.ejes, puntos: [p] };
  estado.trazos.push(trazoActual);
  pintarTrazo(lienzoTrabajo.getContext("2d"), trazoActual); avisarCambioLienzo();
});
superficie.addEventListener("pointermove", e => {
  if (!trazoActual) return;
  const p = puntoDelLienzo(e); if (!p) return;
  const ultimo = trazoActual.puntos[trazoActual.puntos.length - 1];
  if (Math.hypot(p[0] - ultimo[0], p[1] - ultimo[1]) < DISTANCIA_MIN_PUNTOS) return;
  trazoActual.puntos.push(p);
  pintarTrazo(lienzoTrabajo.getContext("2d"), { ...trazoActual, puntos: [ultimo, p] }); avisarCambioLienzo();
});
const terminarTrazo = () => { if (!trazoActual) return; trazoActual = null; guardarObra(); };
superficie.addEventListener("pointerup", terminarTrazo);
superficie.addEventListener("pointercancel", terminarTrazo);

/* ---------- vista de precisión: tocar un punto y ver sus reflejos ---------- */
const lienzoPrecision = $("lienzoPrecision");
let puntoP = [-120, -120];
const cuadros = n => `${n} ${n === 1 ? "cuadro" : "cuadros"}`;
function pintarPrecision() {
  const ctx = lienzoPrecision.getContext("2d");
  pintarFondo(ctx, true); pintarEjes(ctx, estado.ejes);
  ctx.save(); ctx.globalAlpha = 0.45; estado.trazos.forEach(t => pintarTrazo(ctx, t)); ctx.restore();
  const [x, y] = puntoP;
  const imagenes = [...new Map(REFLEJOS[estado.ejes].map(t => t(x, y)).map(q => [q.join(","), q])).values()];
  const dv = Math.abs(x) / CUADRO, dh = Math.abs(y) / CUADRO;
  ctx.save(); ctx.strokeStyle = "#D9701A"; ctx.lineWidth = 4; ctx.setLineDash([8, 6]);
  if (estado.ejes === 4 && imagenes.length > 1) {
    const [cx, cy] = aPx(0, 0); ctx.beginPath(); ctx.arc(cx, cy, Math.hypot(x, y) * ESCALA, 0, 2 * Math.PI); ctx.stroke();
  } else {
    imagenes.forEach(q => { const [a, b] = aPx(x, y), [c, d] = aPx(...q); if (q[1] === y && q[0] !== x) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); } });
    if (estado.ejes === 2) imagenes.forEach(q => { const [a, b] = aPx(x, y), [c, d] = aPx(...q); if (q[0] === x && q[1] !== y) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); } });
  }
  ctx.restore();
  ctx.font = "700 26px Segoe UI, sans-serif"; ctx.textAlign = "center";
  const etiqueta = (t, px, py) => { const w = ctx.measureText(t).width; ctx.fillStyle = "#FBFAF6"; ctx.fillRect(px - w / 2 - 6, py - 22, w + 12, 30); ctx.fillStyle = "#1B3A6B"; ctx.fillText(t, px, py); };
  imagenes.forEach((q, i) => {
    const [px, py] = aPx(...q);
    ctx.fillStyle = i ? "#D9701A" : "#1B3A6B"; ctx.beginPath(); ctx.arc(px, py, 11, 0, 2 * Math.PI); ctx.fill();
    etiqueta(i ? (imagenes.length === 2 ? "P'" : `P${i}`) : "P", px + (q[0] >= 0 ? 30 : -30), py - 14);
  });
  let texto;
  if (imagenes.length === 1) texto = estado.ejes === 1 ? "Este punto está sobre el eje: su reflejo es él mismo." : "Este punto es el centro: está en todos los ejes y no se mueve.";
  else if (estado.ejes === 1) texto = `P está a ${cuadros(dv)} del eje y P' también, del otro lado. Entre los dos hay ${cuadros(2 * dv)}.`;
  else if (estado.ejes === 2) texto = `P está a ${cuadros(dv)} del eje vertical y a ${cuadros(dh)} del horizontal. Sus reflejos guardan esas mismas distancias.`;
  else texto = `P tiene ${imagenes.length - 1} reflejos y todos quedan a la misma distancia del centro: por eso caen sobre el mismo círculo.`;
  $("explica").textContent = texto + " Toca otro punto de la cuadrícula para medir.";
}
lienzoPrecision.addEventListener("pointerdown", e => {
  const r = lienzoPrecision.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width - 0.5) * ANCHO_U, y = ((e.clientY - r.top) / r.height - 0.5) * ALTO_U;
  // se ajusta al cruce más cercano de la cuadrícula para poder contar cuadros enteros
  puntoP = [Math.round(x / CUADRO) * CUADRO, Math.round(y / CUADRO) * CUADRO];
  pintarPrecision();
});
$("btnPrecision").onclick = () => { cerrarHojas(); $("globo").hidden = true; $("precision").hidden = false; $("estado").textContent = "Vista de precisión"; pintarPrecision(); };
$("btnVolverTaller").onclick = () => { $("precision").hidden = true; marcarEjes(); };

/* ---------- las vistas de la estación ---------- */
function mostrarPanel(vista) {
  estado.vista = vista;
  if (LUGARES_MATI[vista]) destinoMati = LUGARES_MATI[vista];
  if (recorrido && vista !== "recorrido") recorrido.desactivar();
  $("panelLlegada").hidden = vista !== "llegada";
  $("panelTrabajo").hidden = vista !== "trabajo";
  $("panelObra").hidden = vista !== "obra";
  $("panelRecorrido").hidden = vista !== "recorrido";
  cerrarHojas();
}
// la llegada es justo a la salida del portal, mirando el stand, a la altura de los ojos de un estudiante
function vistaLlegada() {
  // en un celular vertical hay que mirar desde más atrás para que quepan Mati y el bastidor: a un lado del portal, no a través de él
  const angosto = mundo.camara.aspect < 0.8, lado = new THREE.Vector3(portal.normal.z, 0, -portal.normal.x);
  const pos = angosto
    ? portal.centro.clone().addScaledVector(portal.normal, -4).addScaledVector(lado, 2.3)
    : portal.centro.clone().addScaledVector(portal.normal, 1.1);
  pos.y = ALTO_PISO_PARADA + (angosto ? 2.6 : 1.7);
  return { pos, mira: new THREE.Vector3(-0.6, 1.3, -0.6) };
}
async function irALlegada() {
  mostrarPanel("llegada"); $("estado").textContent = "Llegada";
  if (mundo) { const v = vistaLlegada(); mundo.soltarEncuadre(); await mundo.viajar(v.pos, v.mira); }
}
function saludoDeMati() {
  if (R_MATI) R_MATI.saludoHasta = mundo.reloj.t + 2.2;
  decirMati("<b>Mati:</b> Bienvenido al taller de los espejos. El bastidor está en blanco para que crees lo que quieras: elige uno, dos o cuatro ejes y el espejo hace el resto. Si buscas ideas, mira las criaturas del Sinú en Muestras.");
}
async function irATrabajo({ instantaneo = false } = {}) {
  mostrarPanel("trabajo"); marcarEjes();
  $("ligera").hidden = !usarLigera;
  if (mundo) await mundo.irA(ENCUADRES.trabajo, { instantaneo });
}
async function irAObra() {
  if (!estado.trazos.length) { decirMati("Aún no hay trazos en el bastidor. Dibuja de un lado y mira cómo el espejo completa tu obra.", { segundos: 6 }); return; }
  pintarObra(lienzoObra.getContext("2d"));
  mostrarPanel("obra"); $("estado").textContent = "Galería de espejos";
  const titulo = estado.nombre ? `"${estado.nombre}"` : "Tu obra";
  if (mundo) { texObra.needsUpdate = true; colgarMuestrasEnGaleria(); await mundo.irA(ENCUADRES.obra); }
  else $("ligera").replaceChildren(lienzoObra);
  decirMati(`<b>Insignia Guardián de la Simetría.</b> ${titulo} ya está en la galería. Lo que hiciste de un lado, el espejo lo devolvió del otro.`);
}
$("btnSaltar").onclick = () => { $("globo").hidden = true; irATrabajo({ instantaneo: true }); };
$("btnAlBastidor").onclick = async () => { $("globo").hidden = true; await irATrabajo(); decirMati(MUESTRAS[estado.muestra].pista, { segundos: 8 }); };
$("btnTermine").onclick = irAObra;
$("btnSeguir").onclick = () => { $("globo").hidden = true; if (usarLigera) $("ligera").replaceChildren(lienzoTrabajo); irATrabajo(); };

$("btnDescargar").onclick = () => {
  const c = document.createElement("canvas"); c.width = PX_ANCHO; c.height = PX_ALTO + 70;
  const ctx = c.getContext("2d");
  ctx.drawImage(lienzoObra, 0, 0);
  ctx.fillStyle = "#1B3A6B"; ctx.fillRect(0, PX_ALTO, PX_ANCHO, 70);
  ctx.fillStyle = "#fff"; ctx.font = "700 28px Georgia, serif"; ctx.textBaseline = "middle";
  ctx.fillText(`${estado.nombre || "Mi obra"} - Espejos Vivos - LIVIMA`, 24, PX_ALTO + 35);
  c.toBlob(blob => {
    const enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(blob);
    enlace.download = `espejos-vivos-${(estado.nombre || "mi-obra").toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi, "-")}.png`;
    document.body.appendChild(enlace); enlace.click(); enlace.remove();
    setTimeout(() => URL.revokeObjectURL(enlace.href), 4000);
  });
};

/* ---------- recorrido libre por el stand y la orilla ---------- */
const ES_TACTIL = matchMedia("(pointer: coarse)").matches;
async function irARecorrido() {
  mostrarPanel("recorrido"); $("estado").textContent = "Recorrido libre";
  await recorrido.activar();
  decirMati(ES_TACTIL
    ? "Camina con el control redondo y arrastra el dedo para mirar a tu alrededor. Cuando quieras pintar, toca Ir al bastidor."
    : "Camina con W, A, S, D o con las flechas y arrastra con el ratón para mirar. Cuando quieras pintar, toca Ir al bastidor.", { segundos: 9 });
}
document.querySelectorAll("[data-recorrer]").forEach(b => b.onclick = () => { $("globo").hidden = true; irARecorrido(); });
$("btnVolverBastidor").onclick = () => { $("globo").hidden = true; irATrabajo(); };
$("btnVerGaleria").onclick = () => { $("globo").hidden = true; irAObra(); };

/* ---------- cruzar el portal: el mismo destello del mapa, de ida y de vuelta ---------- */
let cruzando = false;
document.querySelector(".hud .volver").addEventListener("click", async e => {
  e.preventDefault();
  if (cruzando) return; cruzando = true;
  const destino = e.currentTarget.getAttribute("href");
  $("globo").hidden = true; cerrarHojas();
  if (mundo) {
    if (recorrido) recorrido.desactivar();
    mundo.soltarEncuadre();
    await mundo.viajar(portal.centro.clone().addScaledVector(portal.normal, 3.2), portal.centro.clone(), 800);
    $("velo").classList.add("on");
    await mundo.viajar(portal.centro.clone().addScaledVector(portal.normal, -1.2), portal.centro.clone().addScaledVector(portal.normal, -6), 700);
  } else {
    $("velo").classList.add("on");
    await new Promise(r => setTimeout(r, 700));
  }
  location.href = destino;
});
// si el estudiante vuelve con el botón Atrás del navegador, la estación se ve sin destello
addEventListener("pageshow", () => { if (cruzando) { cruzando = false; $("velo").classList.remove("on"); } });

/* ---------- arranque ---------- */
const hayObraPrevia = recuperarObra();
$("nombreObra").value = estado.nombre;
marcarColor(); marcarMuestra(); redibujarTrabajo();
if (usarLigera) {
  $("mundo").hidden = true; $("ligera").append(lienzoTrabajo); $("enlaceLigera").hidden = true;
  document.querySelectorAll("[data-recorrer]").forEach(b => { b.hidden = true; });
  $("velo").classList.remove("on");
  if (!hayWebGL()) avisar("Este equipo no pudo abrir el 3D: estás en la vista ligera, con las mismas herramientas.");
  irATrabajo();
  decirMati(hayObraPrevia ? "Aquí está tu obra, tal como la dejaste." : MUESTRAS[estado.muestra].pista, { segundos: 8 });
} else {
  mundo = crearMundo($("mundo"), { slot: 1 });
  const zonaLibre = (x, z) => x > -4 && x < 8 && z > 4 && z < 18;   // la salida del portal queda despejada
  ({ troncos } = construirRonda(mundo, { zonaLibre }));
  construirEstacion();
  recorrido = crearRecorrido(mundo, {
    limites: { xMin: -60, xMax: 60, zMin: -40, zMax: 60 },
    permitido: (x, z) => z > mundo.rioLocal(x) + 7.5,   // se puede llegar a la playa, pero no meterse al río
    piso: (x, z) => (Math.hypot(x, z) < 5.4 ? ALTO_PISO_PARADA : mundo.alturaLocal(x, z)),
    circulos: [
      ...troncos,
      [ESTANQUE.x, ESTANQUE.z, ESTANQUE.r + 0.1], [3.1, -2.1, 0.55], [PORTAL.x, PORTAL.z, 0.8]
    ],
    obstaculos: [
      { x: BASTIDOR.x, z: BASTIDOR.z - 0.15, ancho: 2.7, fondo: 0.9 },
      ...GALERIA.zs.map(z => ({ x: GALERIA.x - 0.05, z, ancho: 0.5, fondo: 1.3 }))
    ]
  });
  avisarCambioLienzo();
  // se sale del portal: la cámara empieza dentro del remolino y el destello se apaga mientras avanza
  mundo.colocar(portal.centro.clone().addScaledVector(portal.normal, -0.6), portal.centro.clone().addScaledVector(portal.normal, 4));
  requestAnimationFrame(() => requestAnimationFrame(async () => {
    $("velo").classList.remove("on");
    if (hayObraPrevia) {
      mostrarPanel("trabajo"); marcarEjes();
      await mundo.irA(ENCUADRES.trabajo, { ms: 1500 });
      decirMati("Aquí está tu obra, tal como la dejaste.", { segundos: 6 });
    } else {
      mostrarPanel("llegada"); $("estado").textContent = "Llegada";
      const v = vistaLlegada();
      await mundo.viajar(v.pos, v.mira, 1500);
      saludoDeMati();
    }
  }));
}
window.__listo = true;
</script>
</body>
