  <article class="pagina">
    <h2>Ficha de la pareja de espejos</h2>
    <p class="sub">Una misión de reflejos, en parejas de exploradores.</p>

    <p class="etiqueta">Materiales de la expedición</p>
    <p>Un pliego de papel por pareja (bond, cartulina o craft); un espejo pequeño o una superficie que refleje (una mica, un CD, la pantalla apagada del celular); colores o marcadores, lápiz y regla; y esta guía, como cuaderno de campo de la pareja.</p>
  </article>

  <article class="pagina">
    <h2><span class="num">1</span>Observo, el mundo se mira al espejo</h2>
    <p>Busquen simetrías a su alrededor: una hoja, una mariposa, una letra, su propia cara. Usen el test del espejo: apoyen el espejito de pie sobre la mitad de un dibujo u objeto. Si el reflejo completa la figura igualita a la original, esa figura es simétrica.</p>
    <table>
      <tr><th>Objeto que observo</th><th>¿Tiene eje de simetría?</th><th>¿Cuántos?</th></tr>
      <tr><td><i>Una mariposa</i></td><td><i>Sí</i></td><td><i>1</i></td></tr>
      <tr><td><input type="text" aria-label="Objeto 1"></td><td><input type="text" aria-label="Tiene eje, objeto 1"></td><td><input type="text" aria-label="Cuántos ejes, objeto 1"></td></tr>
      <tr><td><input type="text" aria-label="Objeto 2"></td><td><input type="text" aria-label="Tiene eje, objeto 2"></td><td><input type="text" aria-label="Cuántos ejes, objeto 2"></td></tr>
      <tr><td><input type="text" aria-label="Objeto 3"></td><td><input type="text" aria-label="Tiene eje, objeto 3"></td><td><input type="text" aria-label="Cuántos ejes, objeto 3"></td></tr>
      <tr><td><input type="text" aria-label="Objeto 4"></td><td><input type="text" aria-label="Tiene eje, objeto 4"></td><td><input type="text" aria-label="Cuántos ejes, objeto 4"></td></tr>
    </table>

  <article class="pagina">
    <h2><span class="num">2</span>Investigo, encuentro el eje</h2>
    <p>El eje de simetría es la línea por donde se puede doblar una figura para que las dos mitades coincidan exactamente. Algunas figuras tienen un eje, otras varios, y otras ninguno.</p>
    <div class="caja mati"><b>Mati, el que observa:</b> prueba doblando papel: recorta media figura sobre el doblez (medio corazón, media mariposa) y ábrela. El doblez es el eje, y la figura sale simétrica sola. Esa es la magia que van a usar en la obra.</div>
    <p class="etiqueta">Investiguen cuántos ejes tienen estas figuras:</p>
    <div class="campo"><label>Cuadrado: <input type="text"></label><label>Rectángulo: <input type="text"></label></div>
    <div class="campo"><label>Triángulo equilátero: <input type="text"></label><label>Círculo: <input type="text"></label></div>
    <div class="campo"><label>Letra A: <input type="text"></label><label>Letra R: <input type="text"></label></div>
  </article>

  <article class="pagina">
    <h2><span class="num">3</span>Descubro la matemática, la simetría axial</h2>
    <p>Lo que estuvieron explorando tiene nombre: <b>simetría axial</b> (o simetría de reflexión). Una figura la tiene cuando un eje la divide en dos mitades iguales, y cada punto de un lado tiene su reflejo al otro lado, a la misma distancia del eje.</p>
    <table>
      <tr><th>Figura</th><th>Ejes de simetría</th></tr>
      <tr><td>Rectángulo</td><td>2</td></tr>
      <tr><td>Triángulo equilátero</td><td>3</td></tr>
      <tr><td>Cuadrado</td><td>4</td></tr>
      <tr><td>Círculo</td><td>infinitos</td></tr>
    </table>
    <div class="caja mati"><b>Una pista de detective:</b> no todo es simétrico, y eso está bien. La letra R no tiene ningún eje. Tu cara parece simétrica, pero si la divides por la mitad con un espejo verás que las dos mitades no son idénticas: la naturaleza casi siempre se acerca a la simetría, sin llegar a la perfección. Para practicar, crucen el portal del juego, al lado del taller: en Criaturas del espejo completan reflejos con eje vertical, horizontal, doble y diagonal.</div>
  </article>

  <article class="pagina">
    <h2><span class="num">4</span>Creo, nuestro ser simétrico</h2>
    <p class="sub">Fase 4, lo que va a ExpoLIVIMA</p>
    <p><b>Esta es la fase que de verdad importa para la muestra:</b> la obra final no va en esta hoja, va en un pliego grande para la galería. En parejas, creen un ser simétrico (una criatura, un mandala o un autorretrato) usando el eje.</p>
    <p class="etiqueta">Dos técnicas para lograrlo</p>
    <ol class="pasos">
      <li><b>Doblez y pintura:</b> doblen el pliego, pinten con bastante color una sola mitad, vuelvan a doblar y aprieten. Al abrir, el reflejo aparece solo.</li>
      <li><b>Mitad y mitad:</b> marquen el eje con el doblez. Uno dibuja una mitad y el otro la copia reflejada al otro lado, punto por punto.</li>
    </ol>
  </article>

  <article class="pagina">
    <h2>Nuestro ser simétrico</h2>
    <p class="etiqueta">Boceto pequeño (marca el eje)</p>

    </div>

  <article class="pagina">
    <h2><span class="num">5</span>Socializo, la galería de espejos</h2>
    <p class="sub">Rumbo a la ExpoLIVIMA</p>
    <p>Cuelguen todos los seres simétricos uno al lado del otro. El salón entero se vuelve una galería de espejos. Caminen, observen y conversen.</p>
    <div class="caja mati"><b>La pregunta del Guardián:</b> ¿existe la simetría perfecta en la naturaleza, o solo nos acercamos a ella? Miren su propio rostro con el espejo sobre la nariz: ¿las dos mitades son idénticas? Casi siempre hay pequeñas diferencias. La simetría es una tendencia hermosa, no una ley exacta, y las excepciones también tienen su belleza.</div>
    <div class="mati-final"><img src="3d/mati.webp" alt="Mati"><div><b>Mati, el que observa</b>Su mejor ser simétrico viaja a la galería del Observatorio LIVIMA. Entre todas las parejas vamos a armar la gran Galería de Espejos Vivos para la ExpoLIVIMA de fin de año.</div></div>
  </article>

  <article class="pagina">
    <h2>Para seguir en casa</h2>
    <table>
      <tr><th>Observar</th><th>Preguntarte</th><th>Crear y compartir</th></tr>
      <tr>
        <td>Busca tres objetos simétricos en tu casa (un plato, una ventana, un mueble) y marca su eje con un hilo o una regla imaginaria.</td>
        <td>¿Por qué crees que tantos animales y plantas son simétricos? No busques la respuesta correcta, busca tu idea.</td>
        <td>Dibuja un ser simétrico distinto al de tu pliego, usando una de las dos técnicas, y tráelo al Observatorio LIVIMA rumbo a la ExpoLIVIMA.</td>
      </tr>
    </table>
    <div class="caja reto"><b>Reto final de la pareja: insignia Guardián de la Simetría.</b> Entreguen su ser simétrico en el pliego, con el eje bien marcado y las dos mitades que coinciden, más su cartela completa. Y respondan en una línea: ¿cuántos ejes tiene su ser? ¿Dónde encontraron simetría escondida en el colegio? Si lo logran, ganan la insignia Guardián de la Simetría.</div>
